[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocker"
version = "0.1.0"
description = "Multi-Agent automated range/swing trading system powered by LangGraph"
requires-python = ">=3.10"
dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.4.8",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    # Backend service
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # CLI
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    # Data
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    # Analysis
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    # Memory
    "rank-bm25>=0.2.2",
    # Models
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Utils
    "python-dotenv>=1.0.0",
    # Broker (default: Futu paper trading)
    "futu-api>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
brokers = [
    # futu-api is already a core dependency (default broker)
    "easytrader>=0.20.0",
    "ib_insync>=0.9.86",
    "ccxt>=4.0.0",
]

[project.scripts]
stocker = "stocker.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
